
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raas-worker
  namespace: raas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: raas-worker
  template:
    metadata:
      labels:
        app: raas-worker
    spec:
      containers:
        - name: worker
          image: projects-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
