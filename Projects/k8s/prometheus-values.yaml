alertmanager: 
  enabled: false

prometheus-pushgateway:
  enabled: false

prometheus-node-exporter:
  enabled: false

kube-state-metrics:
  enabled: true
  
server:
  persistentVolume:
    enabled: false

retention: 3d

resources:
  requests:
    memory: 256Mi
    cpu: 100m

  limits:
    memory: 512Mi
    cpu: 200m