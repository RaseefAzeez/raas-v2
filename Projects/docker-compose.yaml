services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./v2-clean/api-service
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./v2-clean/worker-service
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
